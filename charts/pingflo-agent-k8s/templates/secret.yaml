{{- /*
  Opaque Secret holding the pairing token. The Deployment reads it
  as PINGFLO_AGENT_TOKEN via envFrom: secretRef so the value never
  appears in the pod spec.

  The K8s agent uses in-cluster Service Account auth for K8s API
  access — no AWS keys, no extra credentials beyond the token.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pingflo-agent-k8s.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pingflo-agent-k8s.labels" . | nindent 4 }}
type: Opaque
stringData:
  PINGFLO_AGENT_TOKEN: {{ required "`.Values.token` is required — paste the one-shot token from the project's Add-agent flow." .Values.token | quote }}
