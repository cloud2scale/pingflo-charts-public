apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pingflo-agent-aws.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pingflo-agent-aws.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "pingflo-agent-aws.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pingflo-agent-aws.selectorLabels" . | nindent 8 }}
      annotations:
        # Roll the pod whenever the Secret content changes (token
        # rotated, AWS keys rotated). Without this annotation the
        # Secret update wouldn't propagate until the next restart.
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "pingflo-agent-aws.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: pingflo-agent-aws
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ include "pingflo-agent-aws.fullname" . }}
          env:
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
