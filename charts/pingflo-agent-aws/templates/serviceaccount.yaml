{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pingflo-agent-aws.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pingflo-agent-aws.labels" . | nindent 4 }}
  {{- if or .Values.serviceAccount.annotations .Values.aws.roleArn }}
  annotations:
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- /*
      IRSA — when `aws.roleArn` is set, annotate the SA so the AWS
      SDK picks up the role via the OIDC provider. Skipped when
      roleArn is empty (instance role or static keys path).
    */}}
    {{- if .Values.aws.roleArn }}
    eks.amazonaws.com/role-arn: {{ .Values.aws.roleArn | quote }}
    {{- end }}
  {{- end }}
{{- end }}
