{{- /*
  Opaque Secret holding the pairing token + optional AWS static
  creds. The Deployment reads each field as an env var via
  envFrom: secretRef so credentials never appear in the pod spec.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pingflo-agent-aws.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pingflo-agent-aws.labels" . | nindent 4 }}
type: Opaque
stringData:
  PINGFLO_AGENT_TOKEN: {{ required "`.Values.token` is required — paste the one-shot token from the project's Add-agent flow." .Values.token | quote }}
  {{- /* AWS static keys — only emitted when both are set. */}}
  {{- if .Values.aws.accessKeyId }}
  AWS_ACCESS_KEY_ID: {{ .Values.aws.accessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ required "`.Values.aws.secretAccessKey` is required when `.Values.aws.accessKeyId` is set." .Values.aws.secretAccessKey | quote }}
  {{- end }}
  {{- if .Values.aws.region }}
  AWS_REGION: {{ .Values.aws.region | quote }}
  {{- end }}
